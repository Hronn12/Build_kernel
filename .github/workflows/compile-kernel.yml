name: Build Peridot Kernel via Repo Script

on:
  workflow_dispatch: # Запуск сборки вручную кнопкой на GitHub

jobs:
  build:
    runs-on: ubuntu-22.04 # Окружение со всеми нужными зависимостями
    steps:
      - name: Checkout Kernel Source and Script
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Скачивает ваш репозиторий вместе с файлом build_6.1.sh

      - name: Install Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y bc build-essential libncurses5-dev libssl-dev xz-utils bzip2 gzip cpio libelf-dev git lz4 tar libtinfo5 python3

      - name: Make Script Executable
        run: |
          # Выдаем права на запуск вашему скрипту, который уже находится в корне
          chmod +x build_6.1.sh

      - name: Run Your Build Script
        run: |
          # Запуск скрипта. Он сам скачает Clang, настроит PATH и начнет сборку
          ./build_6.1.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel-image
          path: |
            build/Image
            build/Image.gz
          if-no-files-found: error
