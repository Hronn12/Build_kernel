name: Build Android Kernel (peridot)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 -b peridot-u-oss https://github.com kernel-source
        
    - name: Download and Patch Build Script
      run: |
        cd kernel-source
        wget https://githubusercontent.com -O build.sh
        
        # Отключаем интерактивное меню menuconfig, чтобы скрипт не зависал в GitHub Actions
        sed -i 's/MENUCONFIG=1/MENUCONFIG=0/g' build.sh
        
        chmod +x build.sh

    - name: Run Build Script
      run: |
        cd kernel-source
        # Запускаем сборку (скрипт сам установит нужные apt-пакеты и скачает Clang)
        ./build.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Peridot
        path: kernel-source/build/
        if-no-files-found: error
