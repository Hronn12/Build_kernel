name: Build Android Kernel (peridot)

on:
  workflow_dispatch: # Позволяет запускать сборку вручную из вкладки Actions

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-24.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Clone Kernel Source
      run: |
        git clone https://github.com/MiCode/Xiaomi_Kernel_OpenSource --depth=1 -b peridot-u-oss kernel-source
        
    - name: Download and Patch Build Script
      run: |
        cd kernel-source
        wget https://raw.githubusercontent.com/Hronn12/Build_kernel/main/build_6.1.sh
        
        chmod +x build_6.1.sh

    - name: Run Build Script
      run: |
        # Запускаем сборку (скрипт сам установит нужные apt-пакеты и скачает Clang)
        ./build.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Kernel-Peridot
        path: kernel-source/build/
        if-no-files-found: error
