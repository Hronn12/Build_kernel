name: Build peridot kernel (MiCode-only sources)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peridot-micode-kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Register a self-hosted Linux x86_64 runner with label kernel-builder.
    # Recommended: 16+ GB RAM and at least 60 GB free disk space.
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    env:
      WORKSPACE_DIR: ${{ github.workspace }}/kernel-workspace
      KERNEL_REPO: https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git
      KERNEL_BRANCH: peridot-u-oss
      CLANG_VERSION: r487747c

    steps:
      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ca-certificates cpio curl \
            device-tree-compiler flex git libelf-dev libncurses-dev \
            libssl-dev lz4 make python3 rsync gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi dwarves
          mkdir -p "$WORKSPACE_DIR"

      - name: Download the Android U Clang toolchain
        shell: bash
        run: |
          set -euxo pipefail
          TOOLCHAIN_DIR="$WORKSPACE_DIR/prebuilts/clang/host/linux-x86/clang-$CLANG_VERSION"
          mkdir -p "$TOOLCHAIN_DIR"
          curl -fL --retry 5 \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-${CLANG_VERSION}.tar.gz" \
            -o "$RUNNER_TEMP/clang-${CLANG_VERSION}.tar.gz"
          tar -xzf "$RUNNER_TEMP/clang-${CLANG_VERSION}.tar.gz" -C "$TOOLCHAIN_DIR"
          test -x "$TOOLCHAIN_DIR/bin/clang"
          "$TOOLCHAIN_DIR/bin/clang" --version

      - name: Clone the only kernel source — MiCode
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth=1 --single-branch \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" "$WORKSPACE_DIR/msm-kernel"
          test -f "$WORKSPACE_DIR/msm-kernel/Makefile"
          test -f "$WORKSPACE_DIR/msm-kernel/build.config.constants"
          test -f "$WORKSPACE_DIR/msm-kernel/arch/arm64/configs/gki_defconfig"
          test -f "$WORKSPACE_DIR/msm-kernel/arch/arm64/configs/vendor/pineapple_GKI.config"
          test -f "$WORKSPACE_DIR/msm-kernel/arch/arm64/configs/vendor/peridot_GKI.config"

      - name: Fix missing HWID Kconfig entry
        working-directory: kernel-workspace/msm-kernel
        shell: bash
        run: |
          set -euxo pipefail

          sed -i \
            '\|source "drivers/misc/hwid/Kconfig"|d' \
            drivers/misc/Kconfig

          if grep -q 'drivers/misc/hwid/Kconfig' drivers/misc/Kconfig; then
            echo "HWID Kconfig entry was not removed"
            exit 1
          fi
      - name: Fix ispv4_defs.h header dependencies
        working-directory: kernel-workspace/msm-kernel
        shell: bash
        run: |
          set -euxo pipefail

          HDR=$(find . \
            -path './usr/include/*' -prune -o \
            -name 'ispv4_defs.h' -print -quit)

          test -n "$HDR"
          echo "Patching: $HDR"

          python3 - "$HDR" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          data = path.read_text()

          if "#include <stdint.h>" not in data:
              data = "#include <stdint.h>\n" + data

          if "#include <time.h>" not in data:
              data = "#include <time.h>\n" + data

          path.write_text(data)
          PY

          head -15 "$HDR"
          
      - name: Show remaining compiler error
        if: always()
        shell: bash
        run: |
          if [ -f kernel-workspace/build.log ]; then
            grep -n -B 8 -A 8 "error:" \
              kernel-workspace/build.log | tail -40
          fi
          
      - name: Configure and compile Image
        shell: bash
        run: |
          set -euxo pipefail

          SRC="$WORKSPACE_DIR/msm-kernel"
          OUT="$WORKSPACE_DIR/out"
          CLANG_BIN="$WORKSPACE_DIR/prebuilts/clang/host/linux-x86/clang-$CLANG_VERSION/bin"
          mkdir -p "$OUT"

          export PATH="$CLANG_BIN:$PATH"
          export ARCH=arm64
          export LLVM=1
          export LLVM_IAS=1

          # MiCode's build.config.constants pins this source branch to r487747c.
          clang --version

          make -C "$SRC" O="$OUT" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            gki_defconfig

          # Apply the device and SoC fragments used by MiCode's peridot GKI config.
          KCONFIG_CONFIG="$OUT/.config" \
            "$SRC/scripts/kconfig/merge_config.sh" \
            -m -r -y -O "$OUT" \
            "$OUT/.config" \
            "$SRC/arch/arm64/configs/vendor/pineapple_GKI.config" \
            "$SRC/arch/arm64/configs/vendor/peridot_GKI.config"

          make -C "$SRC" O="$OUT" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            olddefconfig

          make -C "$SRC" O="$OUT" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            -j8 Image modules dtbs
            2>&1 | tee "$WORKSPACE_DIR/build.log"

          test -s "$OUT/arch/arm64/boot/Image"
          mkdir -p "$WORKSPACE_DIR/dist"
          install -m 0644 "$OUT/arch/arm64/boot/Image" "$WORKSPACE_DIR/dist/Image"
          install -m 0644 "$OUT/.config" "$WORKSPACE_DIR/dist/kernel.config"
          test -s "$WORKSPACE_DIR/dist/Image"
          sha256sum "$WORKSPACE_DIR/dist/Image" | tee "$WORKSPACE_DIR/dist/SHA256SUMS"

      - name: Upload Image
        uses: actions/upload-artifact@v4
        with:
          name: peridot-Image-${{ github.run_number }}
          path: kernel-workspace/dist/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
