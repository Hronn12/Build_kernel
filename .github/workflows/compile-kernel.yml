name: Build Peridot Kernel via Build Script

on:
  workflow_dispatch: # Запуск сборки вручную кнопкой на GitHub

jobs:
  build:
    runs-on: ubuntu-22.04 # Оптимальное окружение для зависимостей скрипта
    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download Build Script
        run: |
          # Скачиваем скрипт, на который вы дали ссылку
          wget build_scripts/build_6.1.sh -O build_6.1.sh
          chmod +x build_6.1.sh

      - name: Patch Script for GitHub Actions
        run: |
          # Отключаем интерактивное меню menuconfig, чтобы сборка на GitHub не зависала
          sed -i 's/MENUCONFIG=1/MENUCONFIG=0/g' build_6.1.sh
          
          # Настраиваем дефконфиг под Xiaomi (сверяем с вашими исходниками)
          # Если peridot_defconfig нет, скрипт автоматически использует gki_defconfig
          if [ -f "arch/arm64/configs/peridot_defconfig" ]; then
            sed -i 's/DEFCONFIG="gki_defconfig"/DEFCONFIG="peridot_defconfig"/g' build_6.1.sh
          fi

      - name: Run Build Script
        run: |
          # Запускаем адаптированный скрипт сборки
          ./build_6.1.sh

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peridot-kernel-image
          path: |
            build/Image
            build/Image.gz
          if-no-files-found: error
